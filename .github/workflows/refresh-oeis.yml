name: refresh-oeis

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build --release
        working-directory: tools
      - name: download the oeis dumps
        run: |
          mkdir -p data
          curl -sSfL --retry 5 -o data/stripped.gz https://oeis.org/stripped.gz
          curl -sSfL --retry 5 -o data/names.gz https://oeis.org/names.gz
      - name: download the index from r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/download-index.mjs data/index
      - name: compute staircases
        run: tools/target/release/pisearch oeis data/stripped.gz data/names.gz data/index data/sequences.sql --snapshot "$(date -u +%Y-%m-%d)"
      - name: import into the standby database and switch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/import-standby.mjs data/sequences.sql
