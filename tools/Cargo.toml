[package]
name = "pisearch"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Builds and queries the pi digit index used by oeis-pi-search"
publish = false

[[bin]]
name = "pisearch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
